<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSY121 Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe6;
    --paper-2:#ece4d6;
    --ink:#2a2520;
    --ink-soft:#6b6157;
    --line:#d8cdb9;
    --card:#fbf8f1;
    --accent:#9a3b2e;
    --disc:#3b6ea5;
    --quiz:#c2872a;
    --jour:#4a7c59;
    --exam:#9a3b2e;
    --agmt:#6b5b95;
    --done-bg:#eef3ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(154,59,46,.05), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(59,110,165,.05), transparent 42%),
      var(--paper);
    color:var(--ink);
    font-family:'DM Sans',sans-serif;
    line-height:1.5;
    padding:28px 18px 80px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto}

  header{margin-bottom:24px}
  .eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
  h1{font-family:'Fraunces',serif;font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:-.01em}
  h1 em{font-style:italic;font-weight:500;color:var(--ink-soft)}
  .sub{color:var(--ink-soft);font-size:.92rem;margin-top:8px}

  .summary{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 22px;
    margin:22px 0 14px;
    box-shadow:0 1px 0 #fff inset, 0 8px 24px rgba(42,37,32,.04);
  }
  .bigrow{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
  .pct{font-family:'Fraunces',serif;font-size:2.8rem;font-weight:800;line-height:.9}
  .pct span{font-size:1.1rem;color:var(--ink-soft);font-weight:500}
  .count{text-align:right;color:var(--ink-soft);font-size:.88rem}
  .count b{color:var(--ink);font-size:1.05rem}
  .bar{height:9px;background:var(--paper-2);border-radius:99px;overflow:hidden;margin:14px 0 4px;border:1px solid var(--line)}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#c4533f);border-radius:99px;transition:width .5s cubic-bezier(.22,1,.36,1);width:0}

  .next{
    margin-top:16px;padding:12px 14px;border-radius:11px;
    background:linear-gradient(180deg,#fff6ee,#fdeede);
    border:1px solid #f0d4bf;display:flex;align-items:center;gap:11px;
  }
  .next .dot{width:9px;height:9px;border-radius:99px;background:var(--accent);flex:0 0 auto;box-shadow:0 0 0 4px rgba(154,59,46,.14)}
  .next .txt{font-size:.88rem}
  .next .txt b{color:var(--accent)}

  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .chip{font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--paper);display:flex;gap:6px;align-items:center}
  .chip .sw{width:8px;height:8px;border-radius:2px}
  .chip .n{color:var(--ink-soft);font-weight:500}

  .week{margin-top:22px}
  .week-head{display:flex;align-items:baseline;gap:10px;padding:0 4px 9px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .wk-no{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600}
  .wk-due{font-size:.78rem;color:var(--ink-soft);margin-left:auto;letter-spacing:.02em}
  .wk-prog{font-size:.74rem;color:var(--ink-soft);font-weight:600}
  .now-tag{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--accent);padding:3px 8px;border-radius:99px}
  .week.current .week-head{border-color:var(--accent)}

  .item{
    display:flex;align-items:flex-start;gap:13px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;margin-bottom:8px;cursor:pointer;
    transition:background .18s,border-color .18s,transform .08s;
    position:relative;overflow:hidden;
  }
  .item:active{transform:scale(.996)}
  .item:hover{border-color:#c9bca5}
  .item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
  .box{
    margin-top:1px;width:22px;height:22px;border-radius:7px;border:2px solid var(--c);
    flex:0 0 auto;display:grid;place-items:center;transition:background .18s;background:transparent;
  }
  .box svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;opacity:0;transform:scale(.5);transition:.18s}
  .meta{flex:1;min-width:0}
  .ttl{font-weight:600;font-size:.96rem;letter-spacing:-.01em}
  .tags{margin-top:3px;font-size:.76rem;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .typetag{font-weight:600;color:var(--c)}
  .lesson{padding-left:8px;border-left:1px solid var(--line)}

  .item.done{background:var(--done-bg);border-color:#cfddc8}
  .item.done .box{background:var(--c)}
  .item.done .box svg{opacity:1;transform:scale(1)}
  .item.done .ttl{text-decoration:line-through;color:var(--ink-soft)}

  footer{margin-top:34px;text-align:center;color:var(--ink-soft);font-size:.78rem}
  .reset{margin-top:10px;background:none;border:1px solid var(--line);color:var(--ink-soft);font-family:inherit;font-size:.76rem;padding:7px 14px;border-radius:99px;cursor:pointer;transition:.18s}
  .reset:hover{border-color:var(--accent);color:var(--accent)}
  .saving{font-size:.72rem;color:var(--ink-soft);opacity:0;transition:opacity .3s}
  .saving.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Stark State College &middot; Summer 2026</div>
    <h1>PSY121 <em>tracker</em></h1>
    <p class="sub">General Psychology &middot; 30 assignments, all due 11:59pm Sunday. Tap anything to check it off. Your progress saves automatically.</p>
  </header>

  <div class="summary">
    <div class="bigrow">
      <div class="pct" id="pct">0<span>%</span></div>
      <div class="count"><b id="doneN">0</b> of <span id="totN">0</span> done<br><span id="ptsN"></span></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="next" id="nextBox"></div>
    <div class="chips" id="chips"></div>
  </div>

  <div id="weeks"></div>

  <footer>
    <div class="saving" id="saving">saved</div>
    <button class="reset" id="reset">Reset all checkmarks</button>
  </footer>
</div>

<script>
const TYPE = {
  discussion:{label:"Discussion", c:"var(--disc)", sw:"#3b6ea5"},
  quiz:{label:"Quiz", c:"var(--quiz)", sw:"#c2872a"},
  journal:{label:"Journal", c:"var(--jour)", sw:"#4a7c59"},
  exam:{label:"Exam", c:"var(--exam)", sw:"#9a3b2e"},
  agreement:{label:"Agreement", c:"var(--agmt)", sw:"#6b5b95"},
};

const WEEKS = [
  {wk:1, due:"2026-06-07", items:[
    {id:"d1", type:"discussion", title:"Discussion 1: Introduce Yourself", lesson:"Lesson 1"},
    {id:"q1", type:"quiz", title:"Quiz 1: Memory", lesson:"Lesson 1"},
    {id:"pa", type:"agreement", title:"Course Participation Agreement", lesson:"Lesson 1"},
    {id:"d2", type:"discussion", title:"Discussion 2: Intelligence", lesson:"Lesson 2"},
    {id:"q2", type:"quiz", title:"Quiz 2: Thinking / Intelligence", lesson:"Lesson 2"},
  ]},
  {wk:2, due:"2026-06-14", items:[
    {id:"d3", type:"discussion", title:"Discussion 3: Discipline", lesson:"Lesson 3"},
    {id:"q3", type:"quiz", title:"Quiz 3: Learning / Conditioning", lesson:"Lesson 3"},
    {id:"e1", type:"exam", title:"Exam 1: Memory, Intelligence, Learning", lesson:"Lesson 4"},
    {id:"j1", type:"journal", title:"Journal 1: Personality (Big Five)", lesson:"Lesson 4"},
  ]},
  {wk:3, due:"2026-06-21", items:[
    {id:"d4", type:"discussion", title:"Discussion 4: The Brain", lesson:"Lesson 5"},
    {id:"q4", type:"quiz", title:"Quiz 4: Biopsychology", lesson:"Lesson 5"},
    {id:"d5", type:"discussion", title:"Discussion 5: I Thought You Meant...", lesson:"Lesson 6"},
    {id:"q5", type:"quiz", title:"Quiz 5: Sensation / Perception", lesson:"Lesson 6"},
  ]},
  {wk:4, due:"2026-06-28", items:[
    {id:"d6", type:"discussion", title:"Discussion 6: Sleepy", lesson:"Lesson 7"},
    {id:"q6", type:"quiz", title:"Quiz 6: States of Consciousness", lesson:"Lesson 7"},
    {id:"e2", type:"exam", title:"Exam 2: Biopsych, Sensation/Perception, Consciousness", lesson:"Lesson 8"},
    {id:"j2", type:"journal", title:"Journal 2: Careers (O*Net)", lesson:"Lesson 8"},
  ]},
  {wk:5, due:"2026-07-05", items:[
    {id:"j3", type:"journal", title:"Journal 3: Research", lesson:"Lesson 9"},
    {id:"d7", type:"discussion", title:"Discussion 7: Morals", lesson:"Lesson 10"},
    {id:"q7", type:"quiz", title:"Quiz 7: Lifespan Development", lesson:"Lesson 10"},
  ]},
  {wk:6, due:"2026-07-12", items:[
    {id:"d8", type:"discussion", title:"Discussion 8: Motivation", lesson:"Lesson 11"},
    {id:"q8", type:"quiz", title:"Quiz 8: Motivation", lesson:"Lesson 11"},
    {id:"e3", type:"exam", title:"Exam 3: Human Development & Motivation", lesson:"Lesson 12"},
    {id:"j4", type:"journal", title:"Journal 4: Stress", lesson:"Lesson 12"},
  ]},
  {wk:7, due:"2026-07-19", items:[
    {id:"d9", type:"discussion", title:"Discussion 9: Prejudice", lesson:"Lesson 13"},
    {id:"q9", type:"quiz", title:"Quiz 9: Social Psychology", lesson:"Lesson 13"},
    {id:"d10", type:"discussion", title:"Discussion 10: What is Happening?", lesson:"Lesson 14"},
    {id:"q10", type:"quiz", title:"Quiz 10: Psychological Disorders", lesson:"Lesson 14"},
  ]},
  {wk:8, due:"2026-07-26", items:[
    {id:"j5", type:"journal", title:"Journal 5: Treatment", lesson:"Lesson 15"},
    {id:"e4", type:"exam", title:"Exam 4: Social Psychology", lesson:"Lesson 16"},
  ]},
];

const ALL = WEEKS.flatMap(w => w.items);
const STORE_KEY = "psy121-progress";
let state = {};

const fmtDue = iso => {
  const d = new Date(iso+"T23:59:00");
  return d.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric"});
};

function load(){
  try{
    const r = localStorage.getItem(STORE_KEY);
    if(r) state = JSON.parse(r);
  }catch(e){ state = {}; }
  render();
}

let saveTimer;
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    const s = document.getElementById("saving");
    s.classList.add("show");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>s.classList.remove("show"), 1100);
  }catch(e){ console.error("save failed", e); }
}

function toggle(id){
  state[id] = !state[id];
  save();
  render();
}

function render(){
  const now = new Date();
  const doneCount = ALL.filter(i=>state[i.id]).length;
  const total = ALL.length;
  const pct = Math.round(doneCount/total*100);

  document.getElementById("pct").innerHTML = pct + '<span>%</span>';
  document.getElementById("doneN").textContent = doneCount;
  document.getElementById("totN").textContent = total;
  document.getElementById("barFill").style.width = pct + "%";

  let nextWk = null;
  for(const w of WEEKS){
    const due = new Date(w.due+"T23:59:59");
    const incomplete = w.items.some(i=>!state[i.id]);
    if(incomplete && due >= new Date(now.toDateString())){ nextWk = w; break; }
  }
  const nb = document.getElementById("nextBox");
  if(nextWk){
    const remaining = nextWk.items.filter(i=>!state[i.id]).length;
    const days = Math.ceil((new Date(nextWk.due+"T23:59:59") - now)/86400000);
    const dayTxt = days<=0 ? "due today" : days===1 ? "due tomorrow" : "in "+days+" days";
    nb.innerHTML = '<span class="dot"></span><span class="txt">Next up: <b>'+remaining+' item'+(remaining>1?'s':'')+'</b> for Week '+nextWk.wk+', '+dayTxt+' ('+fmtDue(nextWk.due)+').</span>';
    nb.style.display="flex";
  } else if(doneCount===total){
    nb.innerHTML = '<span class="dot" style="background:var(--jour);box-shadow:0 0 0 4px rgba(74,124,89,.16)"></span><span class="txt">Everything is checked off. Nice work this semester.</span>';
    nb.style.display="flex";
  } else { nb.style.display="none"; }

  const chips = document.getElementById("chips");
  chips.innerHTML = Object.entries(TYPE).map(([k,t])=>{
    const items = ALL.filter(i=>i.type===k);
    const d = items.filter(i=>state[i.id]).length;
    return '<span class="chip"><span class="sw" style="background:'+t.sw+'"></span>'+t.label+'<span class="n">'+d+'/'+items.length+'</span></span>';
  }).join("");

  const weeksEl = document.getElementById("weeks");
  weeksEl.innerHTML = WEEKS.map(w=>{
    const start = new Date(w.due); start.setDate(start.getDate()-6);
    const isCurrent = now >= new Date(start.toDateString()) && now <= new Date(new Date(w.due+"T23:59:59"));
    const wdone = w.items.filter(i=>state[i.id]).length;
    const items = w.items.map(it=>{
      const t = TYPE[it.type];
      return '<div class="item '+(state[it.id]?'done':'')+'" style="--c:'+t.c+'" data-id="'+it.id+'">'
        + '<div class="box"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>'
        + '<div class="meta"><div class="ttl">'+it.title+'</div>'
        + '<div class="tags"><span class="typetag">'+t.label+'</span><span class="lesson">'+it.lesson+'</span></div></div></div>';
    }).join("");
    return '<section class="week'+(isCurrent?' current':'')+'">'
      + '<div class="week-head"><span class="wk-no">Week '+w.wk+'</span>'
      + (isCurrent?'<span class="now-tag">This week</span>':'')
      + '<span class="wk-prog">'+wdone+'/'+w.items.length+'</span>'
      + '<span class="wk-due">due '+fmtDue(w.due)+'</span></div>'
      + items + '</section>';
  }).join("");

  weeksEl.querySelectorAll(".item").forEach(el=>{
    el.addEventListener("click", ()=>toggle(el.dataset.id));
  });
}

document.getElementById("reset").addEventListener("click", ()=>{
  if(confirm("Clear every checkmark? This can't be undone.")){
    state = {};
    save();
    render();
  }
});

load();
</script>
</body>
</html>
